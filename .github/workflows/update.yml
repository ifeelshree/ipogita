name: Update IPO data
on:
  schedule:
    - cron: "*/30 * * * *"   # about every 30 minutes
  workflow_dispatch:          # lets you press "Run workflow" by hand
permissions:
  contents: write
concurrency:
  group: ipogita-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/update.py
      - name: Save changes
        run: |
          git config user.name "ipogita-bot"
          git config user.email "ipogita-bot@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet || git commit -m "Update IPO data"
          git push
